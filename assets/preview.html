<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stack cards preview</title>
<style>
  body { margin: 0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  section { padding: 32px; }
  .light { background: #ffffff; color: #1f2328; }
  .dark { background: #0d1117; color: #e6edf3; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; max-width: 760px; margin-bottom: 20px; }
  .divider { display: block; margin: 0 0 10px; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 16px; }
</style>
</head>
<body>
<section class="light">
  <h2>Light</h2>
  <img class="divider" src="sections/languages-light.svg" alt="">
  <div class="row">
    <img src="cards/angular-light.svg" alt=""><img src="cards/react-light.svg" alt="">
    <img src="cards/nextjs-light.svg" alt=""><img src="cards/typescript-light.svg" alt="">
    <img src="cards/spring-boot-light.svg" alt=""><img src="cards/java-light.svg" alt="">
    <img src="cards/jsf-light.svg" alt=""><img src="cards/nodejs-light.svg" alt="">
  </div>
  <img class="divider" src="sections/infra-light.svg" alt="">
  <div class="row">
    <img src="cards/docker-light.svg" alt=""><img src="cards/postgresql-light.svg" alt="">
    <img src="cards/aws-light.svg" alt=""><img src="cards/cicd-light.svg" alt="">
  </div>
  <img class="divider" src="sections/ai-light.svg" alt="">
  <div class="row">
    <img src="cards/claude-light.svg" alt=""><img src="cards/codex-light.svg" alt="">
  </div>
</section>
<section class="dark">
  <h2>Dark</h2>
  <img class="divider" src="sections/languages-dark.svg" alt="">
  <div class="row">
    <img src="cards/angular-dark.svg" alt=""><img src="cards/react-dark.svg" alt="">
    <img src="cards/nextjs-dark.svg" alt=""><img src="cards/typescript-dark.svg" alt="">
    <img src="cards/spring-boot-dark.svg" alt=""><img src="cards/java-dark.svg" alt="">
    <img src="cards/jsf-dark.svg" alt=""><img src="cards/nodejs-dark.svg" alt="">
  </div>
  <img class="divider" src="sections/infra-dark.svg" alt="">
  <div class="row">
    <img src="cards/docker-dark.svg" alt=""><img src="cards/postgresql-dark.svg" alt="">
    <img src="cards/aws-dark.svg" alt=""><img src="cards/cicd-dark.svg" alt="">
  </div>
  <img class="divider" src="sections/ai-dark.svg" alt="">
  <div class="row">
    <img src="cards/claude-dark.svg" alt=""><img src="cards/codex-dark.svg" alt="">
  </div>
</section>
</body>
</html>
